# SiteTrackerPro — free, open-source stack.
#   PostgreSQL 16 (database)  +  the app image  +  Caddy 2 (HTTPS + reverse proxy)
#
# Start:    cd deploy && docker compose up -d --build
# Logs:     docker compose logs -f api
# Stop:     docker compose down
# Every setting comes from deploy/.env (copy .env.example to .env first).
name: sitetrackerpro

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sitetrackerpro_v3_enhanced}
      POSTGRES_USER: ${DB_USER:-sitetrackerpro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the $ so the shell inside the container expands these.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    # No "ports:" on purpose: the database is reachable only by the app.

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sitetrackerpro_v3_enhanced}
      DB_USER: ${DB_USER:-sitetrackerpro}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      DB_SSL: "false"          # set to "true" for Neon/Supabase/Render Postgres
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      CORS_ORIGIN: ${APP_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}   # one proxy hop (Caddy) in front of the API
    volumes:
      - uploads:/app/uploads   # imported take-off files survive restarts
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # the free Let's Encrypt certificate lives here
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
